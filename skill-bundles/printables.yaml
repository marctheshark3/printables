name: printables
description: >-
  Text (+ optional image) → intent card → OpenSCAD → DFM-gated STL for a
  Bambu Lab P1S-class bed. Manufacturing loop.
skills:
  - printables-part-brief
  - openscad-printables
  - printables-dfm-gate
instruction: |
  Manufacturing loop — do not skip steps.

  1) PART BRIEF first. Write docs/DESIGN.md intent card (product_class, print_orientation,
     never-list, dimensions). If the user attached an image, run vision_analyze and record
     measured vs assumed dims (image_role: metrology|style|context). Never invent ±0.1 mm
     fits from a single photo.

  2) Lock product class + print orientation before any .scad. Equipment with bottom vents =
     equipment-open-frame (empty under seating, TOP-FIRST).

  3) Scaffold from class templates (open_frame_equipment_scaffold / soft_part_scaffold /
     part_scaffold / pip_hinge). Parametric OpenSCAD only. Echo version, orientation,
     clearance, class in the design.

  4) Docker export (openscad/openscad:2021.01 binstl) then run
     openscad-printables/scripts/validate_export.sh and dfm_gate.py. Fail closed on HARD
     gates (bed, overhang mass, open-under fill, missing mode keys, thin features).

  5) Solid multi-view + under/cutaway + print notes (orientation, flip, supports) + zip STL
     (never raw chat attachments of .stl).

  Defaults: FDM Bambu Lab P1S, PETG preferred, min feature ≥ 1.6 mm, overhangs ≤ 45°,
  fit clearance 0.5–1.0 mm/side. Never ship pin-forest or waffle under seating deck for
  bottom-vent equipment.
