name: printables-blender
description: >-
  Hybrid-aware: intent → OpenSCAD dimensional and/or Blender lattice lid → DFM gate.
  Full enclosures prefer hybrid (SCAD base + Blender/OpenSCAD lid). OpenSCAD alone for stands.
skills:
  - printables-part-brief
  - blender-printables
  - printables-dfm-gate
instruction: |
  Manufacturing loop — hybrid policy locked.

  1) PART BRIEF first. DESIGN.md: product_class, print_orientation, never-list, dims.
     For full cases set backend: hybrid (scaffold_base=openscad, scaffold_lid=blender-bpy
     or openscad Voronoi). Lid-only organic: scaffold: blender-bpy.
     Vision on images; never invent ±0.1 mm fits from one photo.

  2) Backend pick:
     - stands/brackets/open-frame/ported BASE → openscad-printables only
     - hex/Voronoi LID → blender-printables (solid plate + ONE joined cutter) OR OpenSCAD Voronoi
     - full enclosure → hybrid (SCAD base + lattice lid)
     Never pure-Blender ported base as default. Never capsule-soup Voronoi.

  3) Blender path uses pblend only (no host import bpy):
       skills/blender-printables/scripts/pblend
     doctor → run → gate → separate stills → vision → pack zip.

  4) Fail closed on dfm_gate HARD. Lattice lids may need thin-fail-frac 0.35 /
     DESIGN gate_override for tessellation (document it).

  5) Zip STLs. Do not attach raw .stl in chat.

  Defaults: Bambu P1S, PETG, min feature ≥ 1.6 mm, overhangs ≤ 45°.
