schema_version: 1
part:
  name: robot-kit-02-gripper
  revision: 0.1.0
  product_class: robot-module
  purpose: Numbered 02 servo gripper arm with MCU on deck, SG90 at the base, short blocky distal links, and red printed fingers.

manufacturing:
  process: fdm
  printer: generic-256mm
  build_volume_mm: [256, 256, 256]
  material: PETG
  nozzle_mm: 0.4
  layer_height_mm: 0.2

cad:
  backend: openscad
  parametric: true
  units: mm
  source_files:
    - src/gripper.scad
    - src/lib/robot_kit.scad

geometry:
  min_wall_mm: 1.6
  min_feature_mm: 1.6
  overlapping_solids_allowed: false
  stl_files:
    - path: stl/base.stl
      body: base
      expected_shells: 1
    - path: stl/link.stl
      body: link
      expected_shells: 1
    - path: stl/wrist.stl
      body: wrist
      expected_shells: 1
    - path: stl/finger.stl
      body: finger
      expected_shells: 1

fit:
  required: true
  clearance_per_side_mm: 0.4
  evidence: datasheet
  coupon: fit/mcu-pocket-coupon.scad

dimensions:
  - name: base_length
    parameter: base_length_mm
    value_mm: 70.0
    tolerance_mm: 0.2
    source: from-user
  - name: base_width
    parameter: base_width_mm
    value_mm: 40.0
    tolerance_mm: 0.2
    source: from-user
  - name: deck_thickness
    parameter: deck_thickness_mm
    value_mm: 3.2
    tolerance_mm: 0.1
    source: from-user
  - name: wall
    parameter: wall_mm
    value_mm: 2.4
    tolerance_mm: 0.1
    source: from-user
  - name: link_length
    parameter: link_length_mm
    value_mm: 26.0
    tolerance_mm: 0.2
    source: from-user
  - name: link_thickness
    parameter: link_thickness_mm
    value_mm: 8.0
    tolerance_mm: 0.1
    source: from-user
  - name: horn_span
    parameter: horn_span_mm
    value_mm: 18.0
    tolerance_mm: 0.2
    source: from-user
  - name: horn_boss_od
    parameter: horn_boss_od_mm
    value_mm: 10.0
    tolerance_mm: 0.2
    source: from-user
  - name: horn_id
    parameter: horn_id_mm
    value_mm: 2.4
    tolerance_mm: 0.05
    source: datasheet
  - name: finger_thick
    parameter: finger_thick_mm
    value_mm: 3.2
    tolerance_mm: 0.1
    source: from-user

print:
  orientation: base-on-bed
  bed_face: bottom
  up_axis: Z
  supports: none
  max_overhang_deg: 45

service:
  environment: dry
  drainage: not-applicable

hardware:
  components:
    - id: mcu
      mpn_or_generic: ESP32-C3 Super Mini
      role: mcu
      qty: 1
      envelope_mm: [22.5, 18.0, 4.5]
      interfaces:
        - name: mcu_length
          parameter: mcu_length_mm
          value_mm: 22.5
          tolerance_mm: 0.2
          source: datasheet
        - name: mcu_width
          parameter: mcu_width_mm
          value_mm: 18.0
          tolerance_mm: 0.2
          source: datasheet
        - name: mcu_thickness
          parameter: mcu_thickness_mm
          value_mm: 3.5
          tolerance_mm: 0.2
          source: datasheet
        - name: mcu_pocket_clearance
          parameter: mcu_pocket_clearance_mm
          value_mm: 0.4
          tolerance_mm: 0.1
          source: measured
        - name: mcu_pocket_depth
          parameter: mcu_pocket_depth_mm
          value_mm: 1.6
          tolerance_mm: 0.1
          source: from-user
    - id: servo_base
      mpn_or_generic: SG90 9g micro servo
      role: servo
      qty: 1
      envelope_mm: [22.8, 12.2, 22.8]
      interfaces:
        - name: sg90_body_x
          parameter: sg90_body_x_mm
          value_mm: 22.8
          tolerance_mm: 0.2
          source: datasheet
        - name: sg90_body_y
          parameter: sg90_body_y_mm
          value_mm: 12.2
          tolerance_mm: 0.2
          source: datasheet
        - name: sg90_body_z
          parameter: sg90_body_z_mm
          value_mm: 22.8
          tolerance_mm: 0.2
          source: datasheet
        - name: sg90_tab_span
          parameter: sg90_tab_span_mm
          value_mm: 32.3
          tolerance_mm: 0.3
          source: datasheet
        - name: sg90_tab_thick
          parameter: sg90_tab_thick_mm
          value_mm: 2.5
          tolerance_mm: 0.2
          source: datasheet
        - name: sg90_tab_width
          parameter: sg90_tab_width_mm
          value_mm: 12.0
          tolerance_mm: 0.2
          source: datasheet
        - name: sg90_pocket_clearance
          parameter: sg90_pocket_clearance_mm
          value_mm: 0.4
          tolerance_mm: 0.1
          source: measured
    - id: servo_grip
      mpn_or_generic: SG90 9g micro servo
      role: servo
      qty: 1
      envelope_mm: [22.8, 12.2, 22.8]
      interfaces:
        - name: sg90_horn_radius
          parameter: sg90_horn_radius_mm
          value_mm: 16.0
          tolerance_mm: 0.5
          source: datasheet
        - name: sg90_horn_clearance_h
          parameter: sg90_horn_clearance_h_mm
          value_mm: 6.0
          tolerance_mm: 0.2
          source: from-user
    - id: fasteners
      mpn_or_generic: M2 and M3 machine screws
      role: fastener
      qty: 10
      envelope_mm: [6.6, 6.6, 8.0]
      interfaces:
        - name: m2_through
          parameter: m2_through_d_mm
          value_mm: 2.4
          tolerance_mm: 0.05
          source: datasheet
        - name: m3_through
          parameter: m3_through_d_mm
          value_mm: 3.4
          tolerance_mm: 0.05
          source: datasheet
        - name: m2_boss_od
          parameter: m2_boss_od_mm
          value_mm: 5.6
          tolerance_mm: 0.1
          source: datasheet
        - name: m3_boss_od
          parameter: m3_boss_od_mm
          value_mm: 6.6
          tolerance_mm: 0.1
          source: datasheet
    - id: battery
      mpn_or_generic: 1S LiPo pack or 5 V USB power
      role: battery
      qty: 1
      envelope_mm: [30.0, 20.0, 6.0]
      interfaces:
        - name: battery_envelope_h
          parameter: battery_envelope_h_mm
          value_mm: 6.0
          tolerance_mm: 0.2
          source: datasheet

wiring:
  voltage_domains:
    - name: v3v3
      volts: 3.3
    - name: v5
      volts: 5.0
    - name: gnd
      volts: 0.0
  pin_map:
    - mcu_pin: GPIO4
      function: servo_base_pwm
      voltage: 3.3
      net: servo_base_pwm
    - mcu_pin: GPIO5
      function: servo_grip_pwm
      voltage: 3.3
      net: servo_grip_pwm
    - mcu_pin: VIN
      function: servo_vm
      voltage: 5.0
      net: vm
    - mcu_pin: GND
      function: ground
      voltage: 0.0
      net: gnd
  nets:
    - name: servo_base_pwm
      voltage_domain: v3v3
    - name: servo_grip_pwm
      voltage_domain: v3v3
    - name: vm
      voltage_domain: v5
    - name: gnd
      voltage_domain: gnd
  connector_keepouts:
    - name: usb_c
      parameter: usb_c_keepout_w_mm
      width_mm: 13.5
      height_mm: 9.0
      depth_mm: 12.0
      source: datasheet
    - name: usb_c_height
      parameter: usb_c_keepout_h_mm
      width_mm: 13.5
      height_mm: 9.0
      source: datasheet
    - name: usb_c_depth
      parameter: usb_c_keepout_d_mm
      width_mm: 13.5
      height_mm: 9.0
      depth_mm: 12.0
      source: datasheet
  cable_path_keepouts:
    - name: servo_base
      parameter: cable_path_servo_base_w_mm
      width_mm: 4.0
      height_mm: 1.6
      source: from-user
    - name: servo_grip
      parameter: cable_path_servo_grip_w_mm
      width_mm: 4.0
      height_mm: 1.6
      source: from-user
    - name: cable_height
      parameter: cable_path_h_mm
      width_mm: 4.0
      height_mm: 1.6
      source: from-user

assembly:
  frame: assembled
  bodies:
    - id: base
      body: base
      parent: world
      pose:
        xyz_mm: [0.0, 0.0, 0.0]
        rpy_deg: [0.0, 0.0, 0.0]
    - id: link
      body: link
      parent: base
      pose:
        xyz_mm: [51.45, 20.0, 29.0]
        rpy_deg: [0.0, 0.0, 0.0]
    - id: wrist
      body: wrist
      parent: link
      pose:
        xyz_mm: [51.45, 20.0, 39.0]
        rpy_deg: [0.0, 0.0, 0.0]
    - id: finger_left
      body: finger
      parent: wrist
      pose:
        xyz_mm: [51.45, 8.0, 69.8]
        rpy_deg: [0.0, 0.0, 0.0]
    - id: finger_right
      body: finger
      parent: wrist
      pose:
        xyz_mm: [51.45, 32.0, 69.8]
        rpy_deg: [0.0, 0.0, 0.0]
    - id: mcu
      hardware: mcu
      parent: base
      pose:
        xyz_mm: [8.4, 11.0, 1.6]
        rpy_deg: [0.0, 0.0, 0.0]
    - id: servo_base
      hardware: servo_base
      parent: base
      pose:
        xyz_mm: [40.05, 13.9, 3.6]
        rpy_deg: [0.0, 0.0, 0.0]
  joints:
    - id: shoulder
      type: revolute
      parent: base
      child: link
      axis: [0.0, 0.0, 1.0]
      limits:
        min_deg: -15
        max_deg: 15
      clearance_per_side_mm: 0.4
      source: from-user
    - id: gripper
      type: revolute
      parent: wrist
      child: finger_left
      axis: [0.0, 0.0, 1.0]
      limits:
        min_deg: -5
        max_deg: 5
      clearance_per_side_mm: 0.4
      source: from-user

loads:
  - id: gravity
    kind: gravity
    target: assembled
    magnitude: 9810
    units: mm_s2
    safety_factor: 2.0
    source: from-user
  - id: stall_shoulder
    kind: moment
    target: link
    magnitude: 0.18
    units: N_m
    safety_factor: 2.0
    source: datasheet
    section:
      outer_parameter: horn_boss_od_mm
      inner_parameter: horn_id_mm
  - id: stall_gripper
    kind: moment
    target: finger_left
    magnitude: 0.18
    units: N_m
    safety_factor: 2.0
    source: datasheet
    section:
      outer_parameter: horn_boss_od_mm
      inner_parameter: horn_id_mm
