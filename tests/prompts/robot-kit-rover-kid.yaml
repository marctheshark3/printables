id: robot-kit-rover-kid
prompt: |
  Kid-friendly enclosed numbered 01 rover from the v2 ESP32-C3 / N20 / SG90 /
  HC-SR04 kit. Rounded hull and lid hide the MCU, IMU, motors, servo, and wiring.
  Capped toy wheels. Pan head is a visor face with the transducers as eyes.
  PRINT_SPEC robot-module, then validate_project and validate_assembly.
expect:
  primary: 3d-print-robotics
  skills:
    - 3d-print-robotics
    - 3d-print-design-brief
    - 3d-print-openscad
    - 3d-print-validate
  outrank:
    - 3d-print-shop-fixture
    - 3d-print-image-silhouette
    - 3d-print-blender
  skill_contains:
    3d-print-robotics:
      - "product_class: robot-module"
      - hardware
      - validate_project.py
      - lib/robot_kit.scad
run:
  - kind: validate_spec
    path: examples/robot-kit-01-rover-kid/docs/PRINT_SPEC.yaml
  - kind: export_openscad_project
    from: examples/robot-kit-01-rover-kid
  - kind: validate_assembly
    path: examples/robot-kit-01-rover-kid
