id: robot-kit-rover
prompt: |
  Design a numbered 01 two-wheel differential rover as micro-robotics kit modules.
  ESP32-C3 Super Mini MCU on the deck, motor pockets, LED head, M2/M3 fastener
  bosses, cable-path keepouts. PRINT_SPEC product_class robot-module with hardware
  wiring pin map, parametric OpenSCAD chassis/wheels/head, then validate_project.
expect:
  primary: 3d-print-robotics
  skills:
    - 3d-print-robotics
    - 3d-print-design-brief
    - 3d-print-openscad
    - 3d-print-validate
  outrank:
    - 3d-print-shop-fixture
    - 3d-print-image-silhouette
    - 3d-print-blender
  skill_contains:
    3d-print-robotics:
      - "product_class: robot-module"
      - hardware
      - wiring
      - validate_project.py
      - lib/robot_kit.scad
run:
  - kind: validate_spec
    path: examples/robot-kit-01-rover/docs/PRINT_SPEC.yaml
  - kind: export_openscad_project
    from: examples/robot-kit-01-rover
