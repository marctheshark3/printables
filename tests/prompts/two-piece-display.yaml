id: two-piece-display
prompt: |
  Build a two-piece FDM desk enclosure for a small TFT / PyPortal board:
  OpenSCAD base plus bezel, USB and STEMMA keepouts, one STL per body,
  PRINT_SPEC product_class enclosure, then validate_project.
expect:
  primary: 3d-print-display-enclosure
  skills:
    - 3d-print-display-enclosure
    - 3d-print-design-brief
    - 3d-print-openscad
    - 3d-print-validate
  outrank:
    - 3d-print-shop-fixture
    - 3d-print-image-silhouette
  skill_contains:
    3d-print-display-enclosure:
      - "product_class: enclosure"
      - bezel
      - validate_project.py
run:
  - kind: export_openscad_assembly
    sources:
      src/case.scad: "@tests/prompts/fixtures/display_case.scad"
    bodies:
      - path: stl/base.stl
        body: base
        expected_shells: 1
        define: {which: base}
      - path: stl/bezel.stl
        body: bezel
        expected_shells: 1
        define: {which: bezel}
    product_class: enclosure
    parameters:
      - {name: pcb_x, parameter: pcb_x, value_mm: 88.3}
      - {name: pcb_y, parameter: pcb_y, value_mm: 64.3}
      - {name: bezel_z, parameter: bezel_z, value_mm: 2.4}
      - {name: wall_h, parameter: wall_h, value_mm: 14.0}
      - {name: stop, parameter: stop, value_mm: 1.6}
      - {name: post_d, parameter: post_d, value_mm: 8.0}
      - {name: fit_clearance, parameter: fit_clearance, value_mm: 0.4}
      - {name: usb_w, parameter: usb_w, value_mm: 13.0}
      - {name: usb_h, parameter: usb_h, value_mm: 8.5}
      - {name: stemma_w, parameter: stemma_w, value_mm: 22.0}
