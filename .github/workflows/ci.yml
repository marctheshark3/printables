name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install PyYAML pytest
      - name: Contract and STL tests
        run: python3 -m pytest -q skills/3d-print-design-brief/tests skills/3d-print-validate/tests
      - name: Blender CLI tests
        run: python3 -m unittest discover -s skills/3d-print-blender/scripts/tests -v
      - name: Example contract
        run: |
          python3 skills/3d-print-design-brief/scripts/validate_print_spec.py \
            examples/bracket-coupon/docs/PRINT_SPEC.yaml
      - name: Python compile
        run: |
          python3 -m py_compile \
            skills/3d-print-design-brief/scripts/*.py \
            skills/3d-print-validate/scripts/*.py \
            skills/3d-print-blender/scripts/pblend_cli.py \
            skills/3d-print-image-silhouette/scripts/*.py
      - name: Skill frontmatter and routing
        run: python3 tests/test_skill_contract.py
      - name: Secret and private-path scan
        run: |
          if grep -RInE 'spark-adb4|tailf9bab6|\.ts\.net|/home/[A-Za-z0-9._-]+|~/Documents/the-grid|BEGIN (RSA|OPENSSH) PRIVATE|[[:space:]]gho_[A-Za-z0-9]+|[[:space:]]ghp_[A-Za-z0-9]+' \
            --exclude-dir=.git skills examples install.sh; then
            echo "private path or secret-like value found" >&2
            exit 1
          fi
          echo "scan clean"
