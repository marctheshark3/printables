name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install PyYAML pytest
      - name: Contract and STL tests
        run: python3 -m pytest -q skills/3d-print-design-brief/tests skills/3d-print-validate/tests tests/test_prompt_scenarios.py
      - name: Blender CLI tests
        run: python3 -m unittest discover -s skills/3d-print-blender/scripts/tests -v
      - name: Example contract
        run: |
          python3 skills/3d-print-design-brief/scripts/validate_print_spec.py \
            examples/bracket-coupon/docs/PRINT_SPEC.yaml
          python3 skills/3d-print-design-brief/scripts/validate_print_spec.py \
            examples/bracket-coupon-vibecad/docs/PRINT_SPEC.yaml
          python3 skills/3d-print-validate/scripts/validate_project.py \
            examples/bracket-coupon-vibecad
          python3 skills/3d-print-design-brief/scripts/validate_print_spec.py \
            examples/robot-kit-01-rover/docs/PRINT_SPEC.yaml
          python3 skills/3d-print-validate/scripts/validate_project.py \
            examples/robot-kit-01-rover
          python3 skills/3d-print-validate/scripts/validate_assembly.py \
            examples/robot-kit-01-rover
          python3 skills/3d-print-design-brief/scripts/validate_print_spec.py \
            examples/robot-kit-01-rover-v2/docs/PRINT_SPEC.yaml
          python3 skills/3d-print-validate/scripts/validate_project.py \
            examples/robot-kit-01-rover-v2
          python3 skills/3d-print-validate/scripts/validate_assembly.py \
            examples/robot-kit-01-rover-v2
          python3 skills/3d-print-design-brief/scripts/validate_print_spec.py \
            examples/robot-kit-01-rover-kid/docs/PRINT_SPEC.yaml
          python3 skills/3d-print-validate/scripts/validate_project.py \
            examples/robot-kit-01-rover-kid
          python3 skills/3d-print-validate/scripts/validate_assembly.py \
            examples/robot-kit-01-rover-kid
      - name: Rover sim2real extra extra
        run: |
          python3 skills/3d-print-sim/scripts/roll_table_flat.py \
            examples/robot-kit-01-rover
          python3 skills/3d-print-sim/scripts/roll_table_flat.py \
            examples/robot-kit-01-rover-v2
          python3 skills/3d-print-sim/scripts/roll_table_flat.py \
            examples/robot-kit-01-rover-kid


      - name: Python compile
        run: |
          python3 -m py_compile \
            skills/3d-print-design-brief/scripts/*.py \
            skills/3d-print-validate/scripts/*.py \
            skills/3d-print-sim/scripts/*.py \
            skills/3d-print-blender/scripts/pblend_cli.py \
            skills/3d-print-image-silhouette/scripts/*.py
      - name: Skill frontmatter and routing
        run: python3 tests/test_skill_contract.py
      - name: Secret and private-path scan
        run: |
          if grep -RInE 'spark-adb4|tailf9bab6|\.ts\.net|/home/[A-Za-z0-9._-]+|~/Documents/the-grid|BEGIN (RSA|OPENSSH) PRIVATE|[[:space:]]gho_[A-Za-z0-9]+|[[:space:]]ghp_[A-Za-z0-9]+' \
            --exclude-dir=.git skills examples install.sh; then
            echo "private path or secret-like value found" >&2
            exit 1
          fi
          echo "scan clean"

  generate-stls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CAD/CAM tools
        run: |
          python3 -m pip install PyYAML Pillow
          sudo apt-get update
          sudo apt-get install -y blender
          docker pull openscad/openscad:2021.01
          blender --version
      - name: Generate STLs from sample prompts
        env:
          CI: "true"
          PRINTABLES_GENERATE_STLS: "1"
          PRINTABLES_STL_OUT: artifacts/stls
        run: python3 tests/prompt_harness.py
      - name: Upload generated STLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-stls
          path: artifacts/stls/
          if-no-files-found: error
